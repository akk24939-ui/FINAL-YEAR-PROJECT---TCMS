version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: tasmac_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasmac_user
      POSTGRES_PASSWORD: tasmac_pass
      POSTGRES_DB: tasmac_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasmac_user -d tasmac_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tasmac_network

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tasmac_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tasmac_user:tasmac_pass@db:5432/tasmac_db
      SECRET_KEY: tasmac-super-secret-key-change-in-production-2025
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - reports_data:/app/reports
    networks:
      - tasmac_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── React Frontend (Dev Server) ──────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    container_name: tasmac_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - tasmac_network

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tasmac_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - tasmac_network

volumes:
  postgres_data:
  reports_data:

networks:
  tasmac_network:
    driver: bridge
